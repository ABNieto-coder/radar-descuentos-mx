name: Radar de Descuentos MX

on:
  workflow_dispatch:

concurrency:
  group: radar-descuentos-mx-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisar sintaxis y pruebas rápidas
        run: |
          python -m py_compile bot.py reel_publisher.py
          python pruebas_basicas.py

      - name: Ejecutar radar de ofertas
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python bot.py

      - name: Actualizar historial de publicados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch publicados.txt
          git add publicados.txt
          if [ -f reels_log.csv ]; then git add reels_log.csv; fi
          if ! git diff --staged --quiet; then
            git commit -m "Actualiza historial de ofertas"
            for intento in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            echo "No se pudo subir el historial tras 3 intentos."
            exit 1
          fi
