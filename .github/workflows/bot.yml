name: Radar de Descuentos MX

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"   # 09:00 AM CST (UTC-6)
    - cron: "0 19 * * *"   # 01:00 PM CST (UTC-6)
    - cron: "0 0 * * *"    # 06:00 PM CST (UTC-6)

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar radar de ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python main.py

      - name: Actualizar historial de publicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Actualiza historial de ofertas"
          git push
